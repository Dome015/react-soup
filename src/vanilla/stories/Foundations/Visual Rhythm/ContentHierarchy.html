<div class="soup-story-surface">
<div>
<div class="soup-container">
<div class="soup-stack soup-gap--lg">
<div class="soup-grid soup-gap--md">

</div>
<div role="status" class="soup-alert soup-tone--info"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg>
<div><strong>Review ready</strong>

</div>
</div>
<div class="soup-accordion">
<details class="soup-accordion__item" open="">
<summary>How is progress measured?<svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 9 7 7 7-7"></path></svg></summary>
<div class="soup-accordion__content">Completed tasks are counted at the end of each week.</div>
</details>
</div>

up-chart__point" cx="433.3333333333333" cy="133.39999999999998" r="5" tabindex="0" aria-label="Design, Week 3: 11"><title>Design, Week 3: 11</title></circle><circle class="soup-chart__point" cx="620" cy="57.80000000000001" r="5" tabindex="0" aria-label="Design, Week 4: 17"><title>Design, Week 4: 17</title></circle></g><g style="color:var(--soup-chart-color-2)"><g><path class="soup-chart__line" d="M 60 146 L 246.66666666666666 108.19999999999999 L 433.3333333333333 70.39999999999998 L 620 20"></path></g><circle class="soup-chart__point" cx="60" cy="146" r="5" tabindex="0" aria-label="Engineering, Week 1: 10"><title>Engineering, Week 1: 10</title></circle><circle class="soup-chart__point" cx="246.66666666666666" cy="108.19999999999999" r="5" tabindex="0" aria-label="Engineering, Week 2: 13"><title>Engineering, Week 2: 13</title></circle><circle class="soup-chart__point" cx="433.3333333333333" cy="70.39999999999998" r="5" tabindex="0" aria-label="Engineering, Week 3: 16"><title>Engineering, Week 3: 16</title></circle><circle class="soup-chart__point" cx="620" cy="20" r="5" tabindex="0" aria-label="Engineering, Week 4: 20"><title>Engineering, Week 4: 20</title></circle></g></svg></div>
