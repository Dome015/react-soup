<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/PieChart — OneCategory</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../behavior.ts"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<figure class="soup-chart soup-chart--pie"><figcaption class="soup-chart__header"><strong>Single category</strong></figcaption>
<div class="soup-chart__plot"><svg class="soup-chart__pie" viewBox="0 0 320 320" role="img" aria-label="Single category, donut chart"><circle class="soup-chart__ring" cx="160" cy="160" r="100" stroke-width="48" style="color:var(--soup-chart-color-1)" tabindex="0" aria-label="Design: 100 (100%)"><title>Design: 100 (100%)</title></circle><g class="soup-chart__center" aria-hidden="true"><text x="160" y="153" text-anchor="middle">Total</text><text class="soup-chart__center-value" x="160" y="182" text-anchor="middle">100</text></g></svg></div>
<ul class="soup-chart__legend" aria-label="Legend">
<li style="color:var(--soup-chart-color-1)"><span class="soup-chart__swatch" aria-hidden="true"></span><span>Design</span></li>
</ul>
<table class="soup-chart__data"><caption>Single category data</caption>
<thead>
<tr><th scope="col">Category</th><th scope="col">Value</th></tr>
</thead>
<tbody>
<tr><td>Design</td><td>100</td></tr>
</tbody>
</table>
</figure>
</div>
</div>
</body>
</html>
