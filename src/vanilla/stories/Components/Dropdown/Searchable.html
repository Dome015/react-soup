<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Dropdown — Searchable</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../dist/behavior.js"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-field"><label class="soup-field__label" for="story-assignee">Assignee</label>
<div class="soup-dropdown" data-searchable data-clearable data-placeholder="Choose a person">
<div class="soup-dropdown__control"><button id="story-assignee" type="button" class="soup-dropdown__trigger" aria-label="Assignee" aria-haspopup="listbox" aria-expanded="false" aria-controls="story-assignee-listbox"><span class="soup-dropdown__placeholder">Choose a person</span><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 9 7 7 7-7"></path></svg></button></div>
<template data-soup-options>
<div data-value="ada">
<div><strong>Ada Lovelace</strong><small>Design</small></div>
</div>
<div data-value="grace">
<div><strong>Grace Hopper</strong><small>Engineering</small></div>
</div>
<div data-value="lin">
<div><strong>Lin Chen</strong><small>Research</small></div>
</div>
</template>
</div>
</div>
</div>
</div>
</body>
</html>
