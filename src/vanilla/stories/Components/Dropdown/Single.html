<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Dropdown — Single</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../behavior.ts"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-field"><label class="soup-field__label" for="story-zone">Timezone</label>
<div class="soup-dropdown" data-value="rome">
<div class="soup-dropdown__control"><button id="story-zone" type="button" class="soup-dropdown__trigger" aria-label="Timezone" aria-haspopup="listbox" aria-expanded="false" aria-controls="story-zone-listbox"><span class="soup-dropdown__value">Europe / Rome</span><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 9 7 7 7-7"></path></svg></button></div>
<template data-soup-options>
<div data-value="rome">
<div><strong>Europe / Rome</strong></div>
</div>
<div data-value="new-york">
<div><strong>America / New York</strong></div>
</div>
<div data-value="tokyo">
<div><strong>Asia / Tokyo</strong></div>
</div>
</template>
</div>
</div>
</div>
</div>
</body>
</html>
