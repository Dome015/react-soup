<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Dropdown — SearchableMultiple</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../dist/behavior.js"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--md">
<div class="soup-field"><label class="soup-field__label" for="story-disciplines">Disciplines</label>
<div class="soup-dropdown" data-value="design" data-multiple data-searchable data-clearable>
<div class="soup-dropdown__control"><button id="story-disciplines" type="button" class="soup-dropdown__trigger" aria-label="Disciplines" aria-haspopup="listbox" aria-expanded="false" aria-controls="story-disciplines-listbox"><span class="soup-dropdown__value">Design</span><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 9 7 7 7-7"></path></svg></button><button type="button" aria-label="Clear Disciplines" class="soup-icon-button soup-button--secondary soup-button--md"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
<template data-soup-options>
<div data-value="design">
<div><strong>Design</strong></div>
</div>
<div data-value="engineering">
<div><strong>Engineering</strong></div>
</div>
<div data-value="research">
<div><strong>Research</strong></div>
</div>
<div data-value="marketing">
<div><strong>Marketing</strong></div>
</div>
</template>
</div>
</div>
<p>Selected: design</p></div>
</div>
</div>
</body>
</html>
