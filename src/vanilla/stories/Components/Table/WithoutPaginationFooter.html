<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Table — WithoutPaginationFooter</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../dist/behavior.js"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--lg">
<div class="soup-table-data">
<div class="soup-table-scroll" role="region" aria-label="Scrollable table" tabindex="0">
<table class="soup-table" aria-label="One page of projects">
<thead>
<tr><th scope="col">Name</th></tr>
</thead>
<tbody>
<tr><td>Project 01</td></tr>
</tbody>
</table>
</div>
</div>
<div class="soup-table-data">
<div class="soup-table-scroll" role="region" aria-label="Scrollable table" tabindex="0">
<table class="soup-table" aria-label="No projects">
<thead>
<tr><th scope="col">Name</th></tr>
</thead>
<tbody>
<tr><td colSpan="1" class="soup-table__empty">No results</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
