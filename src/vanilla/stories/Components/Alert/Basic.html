<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Alert — Basic</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--md">
<div role="status" class="soup-alert soup-tone--info"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg>
<div><strong>Information</strong>
<div>Your workspace is ready.</div>
</div>
</div>
<div role="status" class="soup-alert soup-tone--success"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg>
<div><strong>Saved</strong>
<div>Settings were updated.</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
