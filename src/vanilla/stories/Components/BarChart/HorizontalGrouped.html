<div class="soup-story-surface">

l="Planned, Design: 22"><title>Planned, Design: 22</title></rect><rect class="soup-chart__bar" x="108" y="147.8144" width="477.8666666666667" height="26.6112" tabindex="0" aria-label="Planned, Engineering: 28"><title>Planned, Engineering: 28</title></rect><rect class="soup-chart__bar" x="108" y="231.8144" width="273.06666666666666" height="26.6112" tabindex="0" aria-label="Planned, Research: 16"><title>Planned, Research: 16</title></rect></g></svg></div>
