<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Tabs — Basic</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">
<script type="module" src="../../../dist/behavior.js"></script>

</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-tabs">
<div role="tablist" aria-label="Project sections" class="soup-tabs__list"><button id="_R_0_-tab-overview" role="tab" type="button" aria-selected="true" aria-controls="_R_0_-panel-overview" tabindex="0">Overview</button><button id="_R_0_-tab-activity" role="tab" type="button" aria-selected="false" aria-controls="_R_0_-panel-activity" tabindex="-1">Activity</button><button id="_R_0_-tab-settings" role="tab" type="button" aria-selected="false" aria-controls="_R_0_-panel-settings" tabindex="-1">Settings</button></div>
<div id="_R_0_-panel-overview" role="tabpanel" aria-labelledby="_R_0_-tab-overview" tabindex="0" class="soup-tabs__panel"><p>Project overview</p></div>
<div id="_R_0_-panel-activity" role="tabpanel" aria-labelledby="_R_0_-tab-activity" hidden="" tabindex="0" class="soup-tabs__panel"><p>Recent activity</p></div>
<div id="_R_0_-panel-settings" role="tabpanel" aria-labelledby="_R_0_-tab-settings" hidden="" tabindex="0" class="soup-tabs__panel"><p>Project settings</p></div>
</div>
</div>
</div>
</body>
</html>
