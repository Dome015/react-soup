<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Progress — Determinate</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--md">
<div class="soup-progress">
<div class="soup-progress__heading"><label for="_R_1_">Uploading files</label><span aria-hidden="true">35%</span></div>
<div class="soup-progress__track"><progress id="_R_1_" class="soup-progress__bar" value="35" max="100"></progress></div>
</div>
<div class="soup-progress">
<div class="soup-progress__heading"><label for="_R_2_">Preparing report</label><span aria-hidden="true">75%</span></div>
<div class="soup-progress__track"><progress id="_R_2_" class="soup-progress__bar" value="3" max="4"></progress></div>
</div>
<div class="soup-progress">
<div class="soup-progress__heading"><label for="_R_3_">Complete</label><span aria-hidden="true">100%</span></div>
<div class="soup-progress__track"><progress id="_R_3_" class="soup-progress__bar" value="100" max="100"></progress></div>
</div>
</div>
</div>
</div>
</body>
</html>
