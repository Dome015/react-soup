<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/FileUpload — States</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--md">
<div class="soup-field"><label class="soup-field__label" for="upload-error">Required attachment</label><input type="file" class="soup-file-upload" id="upload-error" required="" aria-invalid="true" aria-describedby="upload-error-error"/><p class="soup-field__error" id="upload-error-error" role="alert">Choose a file before continuing</p></div>
<div class="soup-field"><label class="soup-field__label" for="upload-disabled">Locked attachment</label><input type="file" class="soup-file-upload" id="upload-disabled" disabled=""/></div>
</div>
</div>
</div>
</body>
</html>
