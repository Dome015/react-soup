<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components/Input — DateAndTimeStates</title>
<link rel="stylesheet" href="../../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div class="soup-story-content">
<div class="soup-stack soup-gap--md">
<div class="soup-field"><label class="soup-field__label" for="input-date-disabled">Unavailable date</label><input type="date" class="soup-input" id="input-date-disabled" disabled="" value="2026-10-15"/></div>
<div class="soup-field"><label class="soup-field__label" for="input-time-error">Review time</label><input type="time" class="soup-input" id="input-time-error" min="09:00" aria-invalid="true" aria-describedby="input-time-error-error" value="08:30"/><p class="soup-field__error" id="input-time-error-error" role="alert">Choose a time after 09:00</p></div>
</div>
</div>
</div>
</body>
</html>
