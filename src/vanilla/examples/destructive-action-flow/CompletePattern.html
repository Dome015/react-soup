<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples/Destructive Action Flow — CompletePattern</title>
<link rel="stylesheet" href="../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../shared/styles/examples.css">
<script type="module" src="../../dist/behavior.js"></script>
<script type="module" src="../../dist/examples/destructive-action-flow/example.js"></script>
</head>
<body>
<div class="soup-story-surface">
<div>
<div class="soup-container">
<main class="soup-example-page">
<div class="soup-stack soup-gap--lg">
<header><h1>Delete workspace</h1><p class="soup-example-lead">This permanently removes projects, files, and invitations.</p></header>
<article class="soup-card">
<div class="soup-stack soup-gap--md">
<div role="status" class="soup-alert soup-tone--warning"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3 2 21h20L12 3Z"></path><path d="M12 9v5M12 18h.01"></path></svg>
<div><strong>Permanent action</strong>
<div>Export anything you need before continuing.</div>
</div>
</div>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--between"><strong>Northstar Studio</strong><button type="button" class="soup-button soup-button--danger soup-button--md" data-soup-dialog-open="soup-dialog-0">Delete workspace</button></div>
</div>
</article>
<dialog id="soup-dialog-0" class="soup-dialog" aria-label="Delete Northstar Studio?" aria-describedby="_R_3_">
<div class="soup-dialog__header">
<div><h2>Delete Northstar Studio?</h2><p id="_R_3_">This cannot be undone.</p></div>
<button type="button" aria-label="Close dialog" class="soup-icon-button soup-button--ghost soup-button--md"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
<div class="soup-dialog__body">
<div class="soup-stack soup-gap--md"><p>Type <strong>Northstar Studio</strong> to confirm.</p>
<div class="soup-field"><label class="soup-field__label" for="delete-confirmation">Workspace name</label><input type="text" class="soup-input" id="delete-confirmation" autoComplete="off" value=""/></div>
</div>
</div>
<div class="soup-dialog__footer"><button type="button" class="soup-button soup-button--secondary soup-button--md">Cancel</button><button type="button" disabled="" class="soup-button soup-button--danger soup-button--md">Delete permanently</button></div>
</dialog>
</div>
</main>
</div>
</div>
</div>
</body>
</html>
