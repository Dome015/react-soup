<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples/Confirmation Dialog — CompletePattern</title>
<link rel="stylesheet" href="../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../shared/styles/examples.css">
<script type="module" src="../../behavior.ts"></script>
<script type="module" src="./example.ts"></script>
</head>
<body>
<div class="soup-story-surface">
<div>
<div class="soup-container">
<main class="soup-example-page">
<div class="soup-stack soup-gap--lg">
<header><h1>Release review</h1><p class="soup-example-lead">Confirm the details before your update goes live.</p></header>
<article class="soup-card">
<div class="soup-stack soup-gap--md">
<div class="soup-inline soup-gap--md soup-align--center soup-justify--between">
<div><h2>September release</h2><p>All changes are ready for review.</p></div>
<span class="soup-badge soup-tone--warning">Draft</span></div>
<hr role="separator" aria-orientation="horizontal" class="soup-separator soup-separator--horizontal"/>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--end"><button type="button" class="soup-button soup-button--primary soup-button--md" data-soup-dialog-open="soup-dialog-0">Publish release</button></div>
</div>
</article>
<dialog id="soup-dialog-0" class="soup-dialog" aria-label="Publish this release?" aria-describedby="_R_3_">
<div class="soup-dialog__header">
<div><h2>Publish this release?</h2><p id="_R_3_">Your team will see the update immediately.</p></div>
<button type="button" aria-label="Close dialog" class="soup-icon-button soup-button--ghost soup-button--md"><svg class="soup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></div>
<div class="soup-dialog__body"><p>Review the release notes before confirming.</p></div>
<div class="soup-dialog__footer"><button type="button" class="soup-button soup-button--secondary soup-button--md">Cancel</button><button type="button" class="soup-button soup-button--primary soup-button--md">Publish</button></div>
</dialog>
</div>
</main>
</div>
</div>
</div>
</body>
</html>
