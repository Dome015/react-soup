<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples/Page Header — CompletePattern</title>
<link rel="stylesheet" href="../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div>
<div class="soup-container">
<main class="soup-example-page">
<div class="soup-stack soup-gap--lg">
<header>
<div class="soup-inline soup-gap--md soup-align--end soup-justify--between">
<div><h1>Good morning, Ada.</h1><p class="soup-example-lead">Here is what is happening across your projects.</p></div>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--start"><button type="button" class="soup-button soup-button--secondary soup-button--md">Export report</button><button type="button" class="soup-button soup-button--primary soup-button--md">New project</button></div>
</div>
</header>
<hr role="separator" aria-orientation="horizontal" class="soup-separator soup-separator--horizontal"/>
<div class="soup-grid soup-gap--md">
<article class="soup-card">
<div class="soup-stack soup-gap--sm"><span class="soup-example-stat-label">Active projects</span><strong class="soup-example-stat">12</strong></div>
</article>
<article class="soup-card">
<div class="soup-stack soup-gap--sm"><span class="soup-example-stat-label">Tasks completed</span><strong class="soup-example-stat">84</strong></div>
</article>
<article class="soup-card">
<div class="soup-stack soup-gap--sm"><span class="soup-example-stat-label">Team members</span><strong class="soup-example-stat">8</strong></div>
</article>
</div>
</div>
</main>
</div>
</div>
</div>
</body>
</html>
