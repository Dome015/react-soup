Product, Feb: 18"><title>Product, Feb: 18</title></circle><circle class="soup-chart__point" cx="284" cy="139.7" r="5" tabindex="0" aria-label="Product, Mar: 21"><title>Product, Mar: 21</title></circle><circle class="soup-chart__point" cx="396" cy="152.3" r="5" tabindex="0" aria-label="Product, Apr: 19"><title>Product, Apr: 19</title></circle><circle class="soup-chart__point" cx="508" cy="95.60000000000002" r="5" tabindex="0" aria-label="Product, May: 28"><title>Product, May: 28</title></circle><circle class="soup-chart__point" cx="620" cy="57.80000000000001" r="5" tabindex="0" aria-label="Product, Jun: 34"><title>Product, Jun: 34</title></circle></g><g style="color:var(--soup-chart-color-2)"><g><path class="soup-chart__line" d="M 60 209 L 172 190.1 L 284 164.9 L 396 127.10000000000002 L 508 114.5 L 620 76.69999999999999"></path></g><circle class="soup-chart__point" cx="60" cy="209" r="5" tabindex="0" aria-label="Platform, Jan: 10"><title>Platform, Jan: 10</title></circle><circle class="soup-chart__point" cx="172" cy="190.1" r="5" tabindex="0" aria-label="Platform, Feb: 13"><title>Platform, Feb: 13</title></circle><circle class="soup-chart__point" cx="284" cy="164.9" r="5" tabindex="0" aria-label="Platform, Mar: 17"><title>Platform, Mar: 17</title></circle><circle class="soup-chart__point" cx="396" cy="127.10000000000002" r="5" tabindex="0" aria-label="Platform, Apr: 23"><title>Platform, Apr: 23</title></circle><circle class="soup-chart__point" cx="508" cy="114.5" r="5" tabindex="0" aria-label="Platform, May: 25"><title>Platform, May: 25</title></circle><circle class="soup-chart__point" cx="620" cy="76.69999999999999" r="5" tabindex="0" aria-label="Platform, Jun: 31"><title>Platform, Jun: 31</title></circle></g></svg></div>
