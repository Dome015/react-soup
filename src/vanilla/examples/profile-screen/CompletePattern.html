<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples/Profile Screen — CompletePattern</title>
<link rel="stylesheet" href="../../../shared/styles/index.css">
<link rel="stylesheet" href="../../../shared/styles/examples.css">


</head>
<body>
<div class="soup-story-surface">
<div>
<div class="soup-container">
<main class="soup-example-page">
<div class="soup-stack soup-gap--lg">
<header>
<div class="soup-inline soup-gap--lg soup-align--center soup-justify--start"><span class="soup-avatar" role="img" aria-label="Ada Lovelace">AL</span>
<div><h1>Ada Lovelace</h1><p class="soup-example-lead">Product designer · Northstar Studio</p></div>
</div>
</header>
<div class="soup-grid soup-gap--md">
<article class="soup-card">
<div class="soup-stack soup-gap--md">
<div class="soup-inline soup-gap--md soup-align--center soup-justify--between"><h2>About</h2><button type="button" class="soup-button soup-button--secondary soup-button--sm">Edit profile</button></div>
<hr role="separator" aria-orientation="horizontal" class="soup-separator soup-separator--horizontal"/><p>Designing clear tools for complex work.</p>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--start"><span class="soup-badge soup-tone--success">Active</span><span class="soup-badge soup-tone--neutral">Workspace owner</span></div>
</div>
</article>
<article class="soup-card">
<div class="soup-stack soup-gap--md"><h2>Contact</h2><hr role="separator" aria-orientation="horizontal" class="soup-separator soup-separator--horizontal"/>
<div><span class="soup-example-caption">Email</span><p><a class="soup-link" href="mailto:ada@example.com">ada@example.com</a></p></div>
<div><span class="soup-example-caption">Location</span><p>London, UK</p></div>
</div>
</article>
</div>
<article class="soup-card">
<div class="soup-stack soup-gap--md"><h2>Recent activity</h2><hr role="separator" aria-orientation="horizontal" class="soup-separator soup-separator--horizontal"/>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--between"><span>Updated project Atlas</span><span class="soup-example-caption">Today</span></div>
<div class="soup-inline soup-gap--md soup-align--center soup-justify--between"><span>Invited a teammate</span><span class="soup-example-caption">Yesterday</span></div>
</div>
</article>
</div>
</main>
</div>
</div>
</div>
</body>
</html>
